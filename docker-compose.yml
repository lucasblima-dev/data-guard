name: dataguard

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dataguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-dataguard}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [ dataguard ]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity" ]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [ dataguard ]

  data-quality-service:
    build: ./services/data-quality-service
    image: dataguard/data-quality-service:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ENVIRONMENT: docker
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dataguard}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dataguard}
      STORAGE_DIR: /app/storage
      MESSAGING_ENABLED: ${MESSAGING_ENABLED:-true}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-dataguard.exchange}
      RABBITMQ_DLX: ${RABBITMQ_DLX:-dataguard.dlx}
    volumes:
      - storage:/app/storage
    ports:
      - "127.0.0.1:8001:8001"
    networks: [ dataguard ]

  intelligence-service:
    build: ./services/intelligence-service
    image: dataguard/intelligence-service:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ENVIRONMENT: docker
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dataguard}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dataguard}
      DATA_QUALITY_SERVICE_URL: http://data-quality-service:8001
      MESSAGING_ENABLED: ${MESSAGING_ENABLED:-true}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-dataguard.exchange}
      RABBITMQ_DLX: ${RABBITMQ_DLX:-dataguard.dlx}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-huggingface}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_MODEL_ID: ${HF_MODEL_ID:-Qwen/Qwen2.5-7B-Instruct}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    extra_hosts:
      - "host.docker.internal:host-gateway" # permite alcancar um Ollama rodando no host
    ports:
      - "127.0.0.1:8002:8002"
    networks: [ dataguard ]

  analysis-service:
    build: ./services/analysis-service
    image: dataguard/analysis-service:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ENVIRONMENT: docker
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dataguard}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dataguard}
      DATA_QUALITY_SERVICE_URL: http://data-quality-service:8001
      INTELLIGENCE_SERVICE_URL: http://intelligence-service:8002
      MESSAGING_ENABLED: ${MESSAGING_ENABLED:-true}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-dataguard.exchange}
      RABBITMQ_DLX: ${RABBITMQ_DLX:-dataguard.dlx}
      STORAGE_DIR: /app/storage
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-25}
    volumes:
      - storage:/app/storage
    ports:
      - "8000:8000"
    networks: [ dataguard ]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
        VITE_USE_MOCKS: "false"
        VITE_MAX_UPLOAD_MB: ${MAX_FILE_SIZE_MB:-25}
    image: dataguard/frontend:local
    restart: unless-stopped
    depends_on:
      analysis-service:
        condition: service_healthy
    ports:
      - "3000:8080"
    networks: [ dataguard ]

volumes:
  pgdata: # dados do PostgreSQL: sobrevivem a "docker compose down"
  rabbitmq_data: # metadados, filas e mensagens persistentes do RabbitMQ
  storage:
    # CSVs enviados, compartilhado entre analysis-service e data-quality-service

networks:
  dataguard:
