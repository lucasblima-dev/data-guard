services:
  # 1. Frontend
  - type: static
    name: dataguard-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://dataguard-analysis-service.onrender.com/api
      - key: VITE_USE_MOCKS
        value: "false"

  # 2. Analysis Service
  - type: web
    name: dataguard-analysis-service
    env: python
    region: ohio
    plan: free
    rootDir: services/analysis-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false # Configurar com a URL do Supabase no Dashboard do Render
      - key: DATA_QUALITY_SERVICE_URL
        value: https://dataguard-data-quality-service.onrender.com
      - key: INTELLIGENCE_SERVICE_URL
        value: https://dataguard-intelligence-service.onrender.com

  # 3. Data Quality Service
  - type: web
    name: dataguard-data-quality-service
    env: python
    region: ohio
    plan: free
    rootDir: services/data-quality-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false # Configurar com a URL do Supabase no Dashboard do Render

  # 4. Intelligence Service
  - type: web
    name: dataguard-intelligence-service
    env: python
    region: ohio
    plan: free
    rootDir: services/intelligence-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false # Configurar com a URL do Supabase no Dashboard do Render
      - key: LLM_ENABLED
        value: "false" # Mantém rules_only em produção gratuita ou altere para "true" com HF_TOKEN
      - key: LLM_PROVIDER
        value: huggingface
