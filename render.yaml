services:
  - type: web
    name: dataguard-analysis-service
    env: python
    region: ohio
    plan: free
    rootDir: services/analysis-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false # configurar manualmente depois
